spring.application.name=api
server.port=${PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Pool que se vacía solo, para que Neon pueda suspender la base aunque Render siga prendido.
# Por defecto Hikari mantiene 10 conexiones abiertas para siempre y cada 2 minutos manda un
# keepalive por cada una: Neon nunca ve los 5 minutos sin actividad que necesita para
# apagarse y factura cómputo las 24 horas. Así, un minuto después del último request el pool
# queda en cero. El costo: la primera consulta después de un rato abre una conexión nueva
# (y, si Neon ya se durmió, espera que despierte, normalmente menos de un segundo).
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=0
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:1800000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

app.cookie.secure=${REFRESH_COOKIE_SECURE:true}
app.cookie.same-site=${REFRESH_COOKIE_SAMESITE:None}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Swagger/OpenAPI apagado salvo que se pida: en producción mostraba el mapa completo de la
# API (rutas, DTOs, mensajes de validación) a cualquiera. En local se prende con
# SWAGGER_ENABLED=true o en application-local.properties. Apagado, las rutas dan 404.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Cuántos proxies propios hay delante de la app, para sacar la IP real del cliente de
# X-Forwarded-For en el rate limit del login (ver RateLimitFilter). 1 = solo Render;
# con Vercel delante pasa a 2. 0 = ignorar el header y usar la conexión directa.
app.security.rate-limit.proxies-confiables=${RATE_LIMIT_TRUSTED_PROXIES:1}

# Credenciales del administrador inicial. Solo se usan si la tabla de usuarios está
# vacía (primer arranque contra una base nueva); con datos ya cargados se ignoran.
app.admin.nombre-inicial=${ADMIN_INITIAL_USERNAME:admin}
app.admin.contrasena-inicial=${ADMIN_INITIAL_PASSWORD:}