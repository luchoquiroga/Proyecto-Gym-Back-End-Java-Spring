spring.application.name=api
# Credenciales y conexión a la base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/Gimnasio_db
spring.datasource.username=postgres
spring.datasource.password=f.c.barcelona10

# Configuración de Hibernate (ORM)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Configuración de JWT: la clave secreta (HMAC-SHA256, mínimo 256 bits) se toma de la variable
# de entorno JWT_SECRET y NO tiene valor por defecto a propósito: si falta, la app no arranca,
# en vez de arrancar con una clave débil y conocida commiteada en el repositorio.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000