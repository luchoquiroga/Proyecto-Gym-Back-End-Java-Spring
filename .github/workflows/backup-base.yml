# Backup diario de la base de producción (Supabase), cifrado.
#
# Por qué existe: el plan gratis de Supabase no trae backups descargables, y perder la base
# de un cliente es irrecuperable. Esto saca un pg_dump por día, verifica que se pueda leer,
# lo cifra con AES-256 y lo guarda como artifact del run durante 30 días. Cómo restaurarlo:
# specs/DESPLIEGUE.md §8.
#
# Secrets que hay que cargar en GitHub (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     URI del Session pooler con el usuario dueño (postgres.<ref>), la de
#                       "Connect" en Supabase: postgresql://postgres.<ref>:<clave>@aws-0-...:5432/postgres
#                       El dueño hace falta porque las tablas tienen RLS (V8) y el usuario de la
#                       app (gimnasio_runtime) no ve todas las filas.
#   BACKUP_PASSPHRASE   Clave para cifrar. Generala con `openssl rand -base64 32` y guardala
#                       TAMBIÉN fuera de GitHub (gestor de contraseñas): sin ella, los backups
#                       no sirven para nada.
#
# El cifrado no es opcional: si el repo es público, cualquier usuario logueado de GitHub
# puede bajar los artifacts.
name: Backup de la base

on:
  schedule:
    - cron: '0 6 * * *' # 03:00 en Argentina, la hora de menos uso
  workflow_dispatch: # para correrlo a mano desde la pestaña Actions

permissions:
  contents: read

concurrency:
  group: backup-base
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PGSSLMODE: require
    steps:
      - name: Verificar que estén los secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Faltan los secrets SUPABASE_DB_URL y/o BACKUP_PASSPHRASE"
            exit 1
          fi

      # pg_dump tiene que ser de la misma versión que el servidor o más nueva: el 18
      # sirve para cualquier Postgres de Supabase.
      - name: Instalar pg_dump 18
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version

      # Solo el esquema public: el resto (auth, storage, ...) es de Supabase.
      - name: Volcar la base
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          /usr/lib/postgresql/18/bin/pg_dump "$SUPABASE_DB_URL" \
            --schema=public --format=custom --no-owner --no-privileges \
            --file=backup.dump
          ls -la backup.dump

      # Un backup que no se puede leer es peor que ninguno, porque da tranquilidad falsa.
      - name: Verificar que el dump se pueda leer y traiga los datos
        run: |
          /usr/lib/postgresql/18/bin/pg_restore --list backup.dump > contenido.txt
          for tabla in usuarios clientes planes pagos flyway_schema_history; do
            grep -q "TABLE DATA public $tabla " contenido.txt \
              || { echo "::error::El dump no trae los datos de $tabla"; exit 1; }
          done

      # La clave entra por stdin y no como argumento, para que no aparezca en la lista
      # de procesos del runner.
      - name: Cifrar
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output "backup-$(date -u +%Y-%m-%d).dump.gpg" backup.dump
          shred -u backup.dump contenido.txt

      - name: Guardar el backup cifrado
        uses: actions/upload-artifact@v4
        with:
          name: backup-base-${{ github.run_id }}
          path: backup-*.dump.gpg
          retention-days: 30
          if-no-files-found: error
